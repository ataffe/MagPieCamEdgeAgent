# Builds the ByteTrack library + IMX500 parser and runs the unit tests.
# The camera client (`track`) needs the Raspberry Pi camera stack (libcamera,
# OpenCV, rpicam-apps), which isn't available on GitHub runners and can't be
# exercised without the IMX500 sensor — so CI builds with -DBUILD_CAMERA_APP=OFF
# and tests only the portable, hardware-independent code.
name: CMake (library + tests)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        c_compiler: [gcc, clang]
        include:
          - c_compiler: gcc
            cpp_compiler: g++
          - c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      # cpr is built with CPR_USE_SYSTEM_CURL=ON (see CMakeLists.txt), so the
      # system libcurl dev package must be present for find_package(CURL) to
      # succeed.
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_CAMERA_APP=OFF
        -DBUILD_TESTING=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config Release

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --build-config Release --output-on-failure
